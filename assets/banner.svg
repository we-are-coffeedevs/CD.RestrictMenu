<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" role="img" aria-label="CD.RestrictMenu – die Backend-Navigation von WordPress für jeden Benutzer einzeln festlegen" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2327"/>
      <stop offset="1" stop-color="#2c3338"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b849" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f0b849" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <g id="cb-on">
      <rect width="18" height="18" rx="3" fill="#3858e9"/>
      <path d="M4.2 9.4l3.2 3.2 6.4-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="cb-off">
      <rect x="0.75" y="0.75" width="16.5" height="16.5" rx="3" fill="#fff" stroke="#8c8f94" stroke-width="1.5"/>
    </g>
    <g id="tick">
      <circle cx="11" cy="11" r="11" fill="#f0b849"/>
      <path d="M6 11.4l3.4 3.4 6.6-7.4" fill="none" stroke="#1d2327" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1400" height="640" fill="url(#bg)"/>
  <circle cx="1010" cy="300" r="520" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="640" fill="#f0b849"/>

  <!-- Linke Spalte: Name und Nutzen -->
  <rect x="60" y="112" width="262" height="30" rx="15" fill="none" stroke="#f0b849" stroke-width="1.5"/>
  <text x="191" y="132" text-anchor="middle" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#f0b849">WORDPRESS · MUST-USE-PLUGIN</text>

  <text x="58" y="218" font-size="58" font-weight="700" fill="#ffffff"><tspan fill="#f0b849">CD.</tspan>RestrictMenu</text>

  <text font-size="22" fill="#c3c4c7">
    <tspan x="60" y="268">Die Backend-Navigation für jeden</tspan>
    <tspan x="60" y="298">Benutzer einzeln festlegen.</tspan>
  </text>

  <g font-size="16.5" fill="#f0f0f1">
    <use href="#tick" x="60" y="345"/>
    <text x="94" y="362">Menüpunkte und Admin-Leiste ausblenden</text>
    <use href="#tick" x="60" y="383"/>
    <text x="94" y="400">Ausgeblendete Seiten auch per URL gesperrt</text>
    <use href="#tick" x="60" y="421"/>
    <text x="94" y="438">Einzelne Rechte gezielt freischalten</text>
    <use href="#tick" x="60" y="459"/>
    <text x="94" y="476">Profil kopieren und als PDF dokumentieren</text>
  </g>

  <!-- coffeedevs-Logo -->
  <svg x="60" y="532" width="40" height="40" viewBox="0 0 120 120">
    <rect width="120" height="120" rx="26" fill="#F6F1EA"/>
    <g transform="translate(60 61) scale(1.08) translate(-66 -59)">
      <path d="M40 36 c-4 -6 4 -10 0 -16" fill="none" stroke="#2A1A12" stroke-width="7.6" stroke-linecap="round"/>
      <path d="M54 36 c-4 -6 4 -10 0 -16" fill="none" stroke="#2A1A12" stroke-width="7.6" stroke-linecap="round"/>
      <path d="M68 36 c-4 -6 4 -10 0 -16" fill="none" stroke="#2A1A12" stroke-width="7.6" stroke-linecap="round"/>
      <path d="M40 36 c-4 -6 4 -10 0 -16" fill="none" stroke="#C0FFEE" stroke-width="4" stroke-linecap="round"/>
      <path d="M54 36 c-4 -6 4 -10 0 -16" fill="none" stroke="#C0FFEE" stroke-width="4" stroke-linecap="round"/>
      <path d="M68 36 c-4 -6 4 -10 0 -16" fill="none" stroke="#C0FFEE" stroke-width="4" stroke-linecap="round"/>
      <path d="M84 54 h8 a12 12 0 0 1 0 24 h-8" fill="none" stroke="#2A1A12" stroke-width="7"/>
      <path d="M24 44 H84 V78 a22 22 0 0 1 -22 22 H46 a22 22 0 0 1 -22 -22 Z" fill="#2A1A12"/>
      <path d="M44 62 L36 71 L44 80" fill="none" stroke="#F6F1EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M64 62 L72 71 L64 80" fill="none" stroke="#F6F1EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M58 60 L50 82" fill="none" stroke="#F6F1EA" stroke-width="5" stroke-linecap="round"/>
    </g>
  </svg>
  <text x="112" y="557" font-size="15" fill="#c3c4c7">by <tspan font-weight="600" fill="#ffffff">coffeedevs</tspan></text>

  <!-- Rechte Spalte: nachgebaute Einstellungsseite -->
  <g filter="url(#shadow)">
    <rect x="580" y="50" width="770" height="530" rx="8" fill="#ffffff"/>
  </g>
  <text x="608" y="94" font-size="19" font-weight="600" fill="#1d2327">Backend-Navigation</text>
  <line x1="608" y1="110" x2="1322" y2="110" stroke="#dcdcde" stroke-width="1"/>

  <!-- Plugins -->
  <use href="#cb-off" x="608" y="133"/>
  <rect x="638" y="128" width="28" height="28" rx="4" fill="#1d2327"/>
  <g fill="#f0f0f1">
    <rect x="647.5" y="134" width="2.6" height="6" rx="1"/>
    <rect x="654" y="134" width="2.6" height="6" rx="1"/>
    <path d="M645 139.500h14v3.500a7 7 0 0 1-5.600 6.800V152h-2.800v-2.200A7 7 0 0 1 645 143z"/>
  </g>
  <text x="678" y="147" font-size="14.5" fill="#1d2327"><tspan font-weight="600">Plugins</tspan><tspan dx="12" font-size="12" font-style="italic" fill="#996800">für diese Rolle nicht sichtbar –</tspan><tspan dx="7" font-size="17" fill="#8c8f94">☐</tspan><tspan dx="6" font-size="12" fill="#996800">trotzdem freischalten</tspan><tspan dx="10" font-size="11.5" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#646970">activate_plugins</tspan></text>

  <line x1="646" y1="164" x2="646" y2="260" stroke="#dcdcde" stroke-width="2"/>
  <g font-size="13.5" fill="#2c3338">
    <use href="#cb-off" x="662" y="171" transform="translate(66.200 17.100) scale(0.9)"/>
    <text x="688" y="184">Installierte Plugins<tspan dx="12" font-size="12" font-style="italic" fill="#996800">für diese Rolle nicht sichtbar –</tspan><tspan dx="7" font-size="17" fill="#8c8f94">☐</tspan><tspan dx="6" font-size="12" fill="#996800">trotzdem freischalten</tspan><tspan dx="10" font-size="11.5" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#646970">activate_plugins</tspan></text>
    <use href="#cb-off" x="662" y="203" transform="translate(66.200 20.300) scale(0.9)"/>
    <text x="688" y="216">Plugin hinzufügen<tspan dx="12" font-size="12" font-style="italic" fill="#996800">für diese Rolle nicht sichtbar –</tspan><tspan dx="7" font-size="17" fill="#8c8f94">☐</tspan><tspan dx="6" font-size="12" fill="#996800">trotzdem freischalten</tspan><tspan dx="10" font-size="11.5" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#646970">install_plugins</tspan></text>
    <use href="#cb-off" x="662" y="235" transform="translate(66.200 23.500) scale(0.9)"/>
    <text x="688" y="248">Plugin-Datei-Editor<tspan dx="12" font-size="12" font-style="italic" fill="#996800">für diese Rolle nicht sichtbar –</tspan><tspan dx="7" font-size="17" fill="#8c8f94">☐</tspan><tspan dx="6" font-size="12" fill="#996800">trotzdem freischalten</tspan><tspan dx="10" font-size="11.5" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#646970">edit_plugins</tspan></text>
  </g>

  <!-- Benutzer -->
  <use href="#cb-on" x="608" y="283"/>
  <rect x="638" y="278" width="28" height="28" rx="4" fill="#1d2327"/>
  <g fill="#f0f0f1">
    <circle cx="652" cy="288" r="4.300"/>
    <path d="M643.500 301a8.500 7 0 0 1 17 0z"/>
  </g>
  <text x="678" y="297" font-size="14.5" font-weight="600" fill="#1d2327">Benutzer</text>

  <line x1="646" y1="314" x2="646" y2="410" stroke="#dcdcde" stroke-width="2"/>
  <g font-size="13.5" fill="#2c3338">
    <use href="#cb-on" x="662" y="321" transform="translate(66.200 32.100) scale(0.9)"/>
    <text x="688" y="334">Alle Benutzer</text>
    <use href="#cb-on" x="662" y="353" transform="translate(66.200 35.300) scale(0.9)"/>
    <text x="688" y="366">Benutzer hinzufügen<tspan dx="12" font-size="12" font-style="italic" fill="#996800">für diese Rolle nicht sichtbar –</tspan><tspan dx="7" font-size="17" fill="#8c8f94">☐</tspan><tspan dx="6" font-size="12" fill="#996800">trotzdem freischalten</tspan><tspan dx="10" font-size="11.5" font-family="Consolas, 'SF Mono', Menlo, monospace" fill="#646970">create_users</tspan></text>
    <use href="#cb-on" x="662" y="385" transform="translate(66.200 38.500) scale(0.9)"/>
    <text x="688" y="398">Profil</text>
  </g>

  <!-- Werkzeuge -->
  <use href="#cb-off" x="608" y="433"/>
  <rect x="638" y="428" width="28" height="28" rx="4" fill="#1d2327"/>
  <g fill="#f0f0f1" transform="rotate(45 652 442)">
    <rect x="650" y="440" width="4" height="13" rx="1.500"/>
    <path d="M652 431a6 6 0 1 0 0.010 0zM650 430.500v5.500h4v-5.500z" fill-rule="evenodd"/>
  </g>
  <text x="678" y="447" font-size="14.5" font-weight="600" fill="#1d2327">Werkzeuge</text>

  <line x1="646" y1="464" x2="646" y2="560" stroke="#dcdcde" stroke-width="2"/>
  <g font-size="13.5" fill="#2c3338">
    <use href="#cb-off" x="662" y="471" transform="translate(66.200 47.100) scale(0.9)"/>
    <text x="688" y="484">Verfügbare Werkzeuge</text>
    <use href="#cb-off" x="662" y="503" transform="translate(66.200 50.300) scale(0.9)"/>
    <text x="688" y="516">Import</text>
    <use href="#cb-off" x="662" y="535" transform="translate(66.200 53.500) scale(0.9)"/>
    <text x="688" y="548">Export</text>
  </g>
</svg>
